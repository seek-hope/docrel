name: DocRelay

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  doc-check:
    name: Documentation Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed for diff-based checks

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Dogfood the CURRENT source, not the published package — installing
      # doc-relay from npm here would silently test a stale release.
      - name: Build DocRelay from source
        run: |
          npm ci
          npm run build

      - name: Initialize DocRelay
        run: node dist/cli.js init --no-hooks

      - name: Scan codebase
        run: node dist/cli.js scan

      - name: Check documentation health
        run: node dist/cli.js check --strict --format ci

      - name: Impact analysis (changed files)
        run: |
          CHANGED=$(git diff --name-only HEAD~1..HEAD)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs node dist/cli.js impact --format ci
          fi

      - name: Health dashboard
        run: node dist/cli.js health --format ci

      - name: Review summary
        run: node dist/cli.js review --format markdown >> $GITHUB_STEP_SUMMARY
