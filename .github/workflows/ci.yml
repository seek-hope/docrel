name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build, lint & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test CLI
        run: |
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          mkdir -p .docrelay docs src
          printf 'project: smoke\ndoc_dirs: [docs]\ncode_dirs: [src]\n' > .docrelay/config.yaml
          git init -q .
          node "$GITHUB_WORKSPACE/dist/cli.js" status
          node "$GITHUB_WORKSPACE/dist/cli.js" check
