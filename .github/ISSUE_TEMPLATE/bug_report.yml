name: Bug report
description: Something DocRelay does is wrong or surprising
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps, project layout, and config (.docrelay/config.yaml)
      placeholder: |
        1. doc-relay init
        2. doc-relay scan
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DocRelay version
      description: Output of `doc-relay --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version` (must be >= 22.12)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste terminal output or set DOCRELAY_DEBUG=1 and paste logs
      render: shell
